 but I do keep that one cheap Tokina zoom in my bag just in case (update: that Tokina lens fell apart, so now I'm really on all primes).  My favorite film is Agfapan APX 25, which is really a shame because it was discontinued over a year ago (yay for bulk purchases and refrigerators).  Fuji Superia 1600 is nice for shows when I want color, and Tri-X can still rock your face, especially when developed in Rodinal.  I just tried Fuji's Neopan 1600 black and white and I'm very happy with it, so I might switch.  Kodak TMax p3200 is terrible.  I develop all my own black and white stuff, but I don't do the color because I value my lungs.<br><br>I used to feel guilty about being a vegan and using film, but I can't give up either.  If the animal abuse industries went away, there would still be film, so that's what's important.<br><br>Hopefully it looks o.k. in more browsers now.  I don't have a copy of Netscape on my computer with which to check it, but now it should look fine for all of you weirdos out there who aren't using Macs.<br><br>-->Hold on, it's all in the "Music" section now, so this should redirect in a sec...</td></tr></table></body></html>
